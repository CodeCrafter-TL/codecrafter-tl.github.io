<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found</title>
</head>

<body>
    <p style="font-size: 16px; font-weight: bold; margin: 10px;">404 Not Found</p>
    <p style="font-size: 9px; margin: 5px;">3s 后跳转回 Webintosh 主页面</p>

    <script>
        window.onload = () => {
            setTimeout(() => {
                window.location.href = "/";
            }, 3005);
        }
    </script>
</body>

</html>
